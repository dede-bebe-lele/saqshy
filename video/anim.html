<script>
const NS='http://www.w3.org/2000/svg';
const $=(tag,attrs={},parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const set=(e,attrs)=>{for(const k in attrs)e.setAttribute(k,attrs[k]);};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const root=document.getElementById('root');
const W_=(sc,pre,nth=0,fb=0)=>{const ws=(TIMING[sc]||{words:[]}).words;let k=0;for(const w of ws){if(w.w.toLowerCase().startsWith(pre)){if(k===nth)return w.t;k++;}}return fb;};
const LIME='#b6ff3b',VIO='#9b7bff',PINK='#ff4f9a',RED='#ff3b5c',INK='#eef0f6',GRAY='#8a90a6',BG='#07080b';
const RISK=['#171a22','#2c2950','#5b3fc4','#b84ad6','#ff3b5c'];

/* ---------- reusable drawings ---------- */
function bg(parent,glow=true){$('rect',{width:1920,height:1080,fill:BG},parent);if(glow){$('rect',{width:1920,height:1080,fill:'url(#violetGlow)'},parent);$('rect',{width:1920,height:1080,fill:'url(#limeGlow)'},parent);}$('rect',{width:1920,height:1080,fill:'url(#dots)'},parent);}
function textEl(parent,txt,attrs){const e=$('text',attrs,parent);e.textContent=txt;return e;}
function x3d(parent,txt,x,y,size,anchor='start'){
  const g=$('g',{},parent);const shades=['#1d1248','#231656','#301f70','#3e298c','#4c33a8','#5b3fc4','#6a4be0','#7a5cf0'];const d=size/105;
  shades.forEach((c,k)=>{const o=(shades.length-k)*d;textEl(g,txt,{x:x+o,y:y+o,'font-size':size,fill:c,class:'d','text-anchor':anchor,'letter-spacing':-size*.02});});
  textEl(g,txt,{x,y,'font-size':size,fill:LIME,class:'d','text-anchor':anchor,filter:'url(#glowS)','letter-spacing':-size*.02});
  return g;
}
function pine(parent,x,y,s){
  const g=$('g',{transform:`translate(${x},${y}) scale(${s})`},parent);
  $('rect',{x:-5,y:-10,width:10,height:28,fill:'#0b0b0f',stroke:'#3d5a1f','stroke-width':2},g);
  const c=$('path',{d:'M0,-150 L45,-70 L25,-70 L60,-10 L-60,-10 L-25,-70 L-45,-70Z',fill:'#0b0b0f',stroke:LIME,'stroke-width':3,'stroke-linejoin':'round','stroke-opacity':.75},g);
  return {g,c};
}
function flamePath(w,h,t,ph){
  const k=Math.sin(t*9+ph)*.12, k2=Math.cos(t*7+ph*1.7)*.15;
  return `M0,0 C${-w*.55},${-h*.15} ${-w*(.45+k)},${-h*.55} ${-w*.12},${-h*(.75+k2*.3)} C${-w*.05},${-h*.55} ${w*.05},${-h*.62} ${w*(.02+k)},${-h} C${w*.35},${-h*(.7-k2*.2)} ${w*(.6-k)},${-h*.4} ${w*.5},${-h*.12} C${w*.4},${-h*.02} ${w*.2},0 0,0Z`;
}
function flame(parent){
  const g=$('g',{},parent);
  const glow=$('circle',{r:60,fill:'url(#fireGlow)',cy:-30},g);
  const o=$('path',{fill:RED},g), m=$('path',{fill:'#ff8a3d'},g), i=$('path',{fill:'#ffd23f'},g);
  return {g,upd(t,s,x,y,ph=0){set(g,{transform:`translate(${x},${y}) scale(${s})`,opacity:s>0.02?1:0});
    set(o,{d:flamePath(70,150,t,ph)});set(m,{d:flamePath(50,105,t,ph+1)});set(i,{d:flamePath(28,60,t,ph+2)});set(glow,{r:75+8*Math.sin(t*6+ph)});}};
}
function eagle(parent){
  const g=$('g',{},parent);const inner=$('g',{transform:'translate(-110,-110)'},g);
  $('path',{d:'M50,216 C28,170 24,120 45,84 C62,50 100,32 140,36 C165,38 182,50 190,66 C205,80 212,100 206,122 C203,130 196,134 192,130 C194,120 190,110 180,106 L168,112 C160,118 150,120 142,118 C140,140 150,165 165,190 L150,183 L142,206 L128,189 L118,213 L104,193 L92,215 L80,196 L66,217Z',fill:'#0b0b0f',stroke:LIME,'stroke-width':3.5,'stroke-linejoin':'round',filter:'url(#glowS)'},inner);
  $('path',{d:'M180,58 C200,72 214,98 206,122 C203,130 196,134 192,130 C194,120 190,110 180,106 L168,112 C174,96 174,76 180,58Z',fill:LIME},inner);
  const eye=$('g',{},inner);
  $('path',{d:'M112,82 L162,64 C164,80 154,93 140,93 C126,93 116,89 112,82Z',fill:'#fff'},eye);
  const pupil=$('circle',{cx:148,cy:80,r:6,fill:'#0b0b0f'},eye);
  $('path',{d:'M60,120 C70,108 84,104 96,106 M56,146 C68,134 82,130 94,132 M70,170 C80,160 92,156 104,158',stroke:VIO,'stroke-width':3,fill:'none','stroke-linecap':'round',opacity:.85},inner);
  return {g,upd(t,{x,y,s=1,flip=false,look=0,rot=0}){
    set(g,{transform:`translate(${x},${y+Math.sin(t*2.4)*6}) scale(${flip?-s:s},${s}) rotate(${rot+Math.sin(t*1.3)*2})`});
    const blink=(t%3.6)<.12?.1:1;set(eye,{transform:`translate(0,${86*(1-blink)}) scale(1,${blink})`});
    set(pupil,{cx:148+look*5});
  }};
}
function card(parent,{tag,big,unit='',sub,col,w=500}){
  const g=$('g',{},parent);const h=210;
  $('rect',{x:-w/2,y:-h/2,width:w,height:h,fill:'#0b0c12','fill-opacity':.94,stroke:col,'stroke-width':3},g);
  // corner brackets
  [[-1,-1],[1,1]].forEach(([sx,sy])=>$('path',{d:`M${sx*(w/2+12)},${sy*(h/2+12)-sy*(-34)} L${sx*(w/2+12)},${sy*(h/2+12)} L${sx*(w/2+12)-sx*34},${sy*(h/2+12)}`,fill:'none',stroke:col,'stroke-width':4},g));
  const tw=tag.length*15+28;
  $('rect',{x:-w/2,y:-h/2-20,width:tw,height:38,fill:col},g);
  textEl(g,tag,{x:-w/2+14,y:-h/2+7,'font-size':22,'font-weight':800,fill:'#07080b'});
  const bt=textEl(g,big,{x:-w/2+34,y:24,'font-size':110,class:'n',fill:col,filter:'url(#glowS)'});
  textEl(g,unit,{x:-w/2+34+big.length*70+14,y:22,'font-size':40,'font-weight':800,fill:INK});
  textEl(g,sub,{x:-w/2+34,y:78,'font-size':28,'font-weight':500,fill:GRAY});
  return g;
}
function pop(g,t,a,x,y,rot=0){const p=prog(t,a,a+.45);const s=p<=0?0:back(p);set(g,{transform:`translate(${x},${y}) rotate(${rot}) scale(${s})`,opacity:p>0?1:0});}
function typed(el,full,t,a,cps=38){const n=Math.floor(clamp((t-a)*cps,0,full.length));el.textContent=full.slice(0,n)+((t>a&&(n<full.length||(t*2|0)%2))?'_':'');set(el,{opacity:t>a?1:0});}

/* ---------- map projection ---------- */
const MAP={x0:0,y0:0,k:46};
const MX=(lon)=>MAP.x0+(lon-46)*MAP.k*Math.cos(48*Math.PI/180);
const MY=(lat)=>MAP.y0+(55.6-lat)*MAP.k;

/* ================= SCENE 1: the fire ================= */
const s1=$('g',{},root);
bg(s1);
const moon=$('circle',{cx:1520,cy:250,r:70,fill:'#e9e4ff',filter:'url(#glow)',opacity:.9},s1);
$('circle',{cx:1550,cy:232,r:62,fill:BG},s1);
const cloud=$('g',{},s1);
[[0,0,90],[80,-30,80],[160,0,85],[70,25,90]].forEach(([x,y,r])=>$('circle',{cx:x,cy:y,r,fill:'#171332',stroke:VIO,'stroke-width':3,'stroke-opacity':.5},cloud));
[[0,0,86],[80,-30,76],[160,0,81],[70,25,86]].forEach(([x,y,r])=>$('circle',{cx:x,cy:y,r,fill:'#171332'},cloud));
const bolt=$('path',{d:'M0,0 L-30,120 L5,115 L-25,250 L60,90 L20,95 L45,0Z',fill:'#f4ffd6',stroke:LIME,'stroke-width':6,filter:'url(#glow)',opacity:0},s1);
const flash=$('rect',{width:1920,height:1080,fill:LIME,opacity:0},s1);
$('path',{d:'M-100,700 C200,560 420,620 700,560 C1000,500 1200,600 1500,540 C1700,500 1900,560 2100,520 L2100,1100 L-100,1100Z',fill:'#100d1f',stroke:VIO,'stroke-width':2.5,'stroke-opacity':.6},s1);
const forest=$('g',{},s1);
const trees=[];for(let i=0;i<34;i++){const x=-60+i*62+rnd()*30,y=720+rnd()*60,sc=.7+rnd()*.5;trees.push({x,y,sc,...pine(forest,x,y,sc)});}
$('path',{d:'M-100,860 C300,780 600,840 900,800 C1200,760 1500,840 2100,780 L2100,1100 L-100,1100Z',fill:'#0c0b14',stroke:LIME,'stroke-width':2,'stroke-opacity':.35},s1);
const grass=$('g',{},s1);for(let i=0;i<70;i++){const x=rnd()*1920,y=830+rnd()*200;$('path',{d:`M${x},${y} q4,-24 10,-34 M${x+6},${y} q2,-20 -6,-30`,stroke:'#3d5a1f','stroke-width':3,fill:'none','stroke-linecap':'round'},grass);}
const smoke=$('g',{},s1);const puffs=[];for(let i=0;i<26;i++)puffs.push({c:$('circle',{fill:'#241c3a',opacity:0},smoke),x:300+rnd()*1300,ph:rnd()*6,sp:.6+rnd()*.6});
const flamesG=$('g',{},s1);const flames=trees.map((tr,i)=>({...flame(flamesG),tr,delay:Math.abs(tr.x-860)/560}));
const s1cmd=textEl(s1,'',{x:96,y:160,'font-size':34,'font-weight':700,fill:LIME});
const s1date=textEl(s1,'8 JUNE 2023 · ABAI REGION',{x:96,y:240,'font-size':58,class:'d',fill:INK});
const st1=card(s1,{tag:'BURNED',big:'60 000',unit:'ha',sub:'of forest and steppe',col:LIME,w:560});
const st2=card(s1,{tag:'LIVES LOST',big:'15',unit:'people',sub:'died in the fire',col:PINK,w:460});
function scene1(t,D){
  typed(s1cmd,'> ./incident --date 2023-06-08 --region abai',t,.1,44);
  const cx=lerp(-400,700,easeOut(prog(t,0,2.2)));set(cloud,{transform:`translate(${cx},330)`});
  set(bolt,{opacity:(t>2.2&&t<3.0)?1:0,transform:`translate(870,400)`});
  set(flash,{opacity:t>2.2&&t<2.6?.35*(1-prog(t,2.2,2.6)):0});
  const fire=prog(t,2.4,D*.62);
  flames.forEach((f,i)=>{const p=clamp((fire*1.5-f.delay)*2.2);f.upd(t,p*f.tr.sc*1.05,f.tr.x,f.tr.y-40*f.tr.sc,i);
    set(f.tr.c,{stroke:p>.75?'#4a2a3a':p>.05?RED:LIME});});
  puffs.forEach(p=>{const life=((t*p.sp+p.ph)%4)/4;const on=clamp(fire*1.4);set(p.c,{cx:p.x+life*120,cy:740-life*600,r:40+life*90,opacity:on*.7*(1-life)});});
  set(s1date,{opacity:prog(t,1.0,1.6)});
  pop(st1,t,W_(0,'sixty',0,D*.45)-.1,560,450,-3);pop(st2,t,W_(0,'fifteen',0,D*.62)-.1,1320,500,3);
  set(s1,{transform:`translate(960 540) scale(${1+t*.006}) translate(-960 -540)`});
}

/* ================= SCENE 2: the question ================= */
const s2=$('g',{},root);
bg(s2);
const s2map=$('g',{},s2);
const s2outline=$('path',{fill:'#0f1118',stroke:LIME,'stroke-width':5,'stroke-linejoin':'round',filter:'url(#glowS)'},s2map);
const s2pins=$('g',{},s2map);const pins=[];
const e2=eagle(s2);
const ask=$('g',{},s2);
$('rect',{x:0,y:-50,width:900,height:100,fill:'#0b0c12',stroke:VIO,'stroke-width':3},ask);
$('rect',{x:0,y:-50,width:16,height:100,fill:VIO},ask);
const askT=textEl(ask,'',{x:44,y:14,'font-size':38,'font-weight':800,fill:INK});
const s2area=card(s2,{tag:'AREA',big:'2 700 000',unit:'km²',sub:'9th largest country on Earth',col:VIO,w:760});
function scene2(t,D){
  const L=s2outline.getTotalLength?s2outline.getTotalLength():8000;
  set(s2outline,{'stroke-dasharray':L,'stroke-dashoffset':L*(1-ease(prog(t,0,1.6))),'fill-opacity':prog(t,1.2,2)});
  e2.upd(t,{x:lerp(-260,300,easeOut(prog(t,.3,1.4))),y:700,s:1.35,look:Math.sin(t*1.6),rot:t>D*.4?Math.sin(t*2)*6:0});
  pins.forEach((p,i)=>{const a=W_(1,'rangers',0,D*.38)+i*.09;const q=prog(t,a,a+.3);const pulse=1+.08*Math.sin(t*6+i);set(p,{transform:`translate(${p.dataset.x},${p.dataset.y}) scale(${q>0?back(q)*pulse:0})`});});
  const wa=W_(1,'where',0,D*.45)-.2;pop(ask,t,wa,100,190,0);set(ask,{transform:`translate(100,190) scale(${prog(t,wa,wa+.3)>0?1:0})`});
  typed(askT,'> where_do_we_look --tomorrow ?',t,wa,40);
  pop(s2area,t,1.6,1460,830,-2);
}

/* ================= SCENE 3: Saqshy demo ================= */
const s3=$('g',{},root);
bg(s3);
const s3map=$('g',{},s3);
const s3outline=$('path',{fill:'#0f1118',stroke:LIME,'stroke-width':3,'stroke-opacity':.85,filter:'url(#glowS)'},s3map);

$('rect',{x:40,y:-16,width:90,height:32,fill:'#1d1248',stroke:VIO,'stroke-width':4},sat);
[-100,-70,70,100].forEach(x=>$('line',{x1:x,y1:-16,x2:x,y2:16,stroke:VIO,'stroke-width':2},sat));
$('circle',{cx:0,cy:32,r:9,fill:LIME},sat);

x3d(logo,'SAQSHY',130,40,130);
textEl(logo,'САҚШЫ = "GUARDIAN" IN KAZAKH',{x:136,y:100,'font-size':30,'font-weight':800,fill:VIO,'letter-spacing':2});
const dayLbl=textEl(s3,'',{x:1840,y:160,'text-anchor':'end','font-size':50,class:'d',fill:INK});

textEl(legend,'// fire risk tomorrow',{x:0,y:-16,'font-size':24,'font-weight':700,fill:GRAY});
RISK.forEach((c,i)=>$('rect',{x:i*62,y:0,width:58,height:24,fill:c,stroke:i?'none':'#2a2e3a'},legend));
textEl(legend,'low',{x:0,y:56,'font-size':22,fill:GRAY});textEl(legend,'riskiest 10%',{x:306,y:56,'text-anchor':'end','font-size':22,fill:RED});
const phone=$('g',{},s3);
$('rect',{x:-160,y:-300,width:320,height:600,rx:44,fill:'#0b0c12',stroke:LIME,'stroke-width':4,filter:'url(#glowS)'},phone);

$('rect',{x:-135,y:-200,width:6,height:300,fill:PINK},msg);
const msgLines=['⚠️ Ертең өрт қаупі','өте жоғары!','Қостанай облысы','Патрульді күшейтіңіз,','сабан өртемеңіз.','—','Завтра очень высокая','пожарная опасность'];
msgLines.forEach((l,i)=>textEl(msg,l,{x:-116,y:-160+i*34,'font-size':i<2?25:19,'font-weight':i<2?800:500,fill:i<2?PINK:INK,'font-family':'Manrope, Arial, sans-serif'}));
function buildMap(){
  const W=1180;MAP.k=W/(42*Math.cos(48*Math.PI/180));MAP.x0=330;MAP.y0=250;
  s3outline.setAttribute('d',OUTLINE.map(([lo,la],i)=>(i?'L':'M')+MX(lo).toFixed(1)+','+MY(la).toFixed(1)).join('')+'Z');
  const cw=0.5*MAP.k*Math.cos(48*Math.PI/180), ch=0.5*MAP.k;
  DATA.cells.forEach(([la,lo,c],i)=>{$('rect',{x:MX(lo-.25)+1,y:MY(la+.25)+1,width:cw-2,height:ch-2,fill:RISK[c],opacity:0},cellsG);});
  DATA.fires.forEach(([la,lo],i)=>$('circle',{cx:MX(lo),cy:MY(la),r:5,fill:LIME,stroke:'#07080b','stroke-width':1.5,opacity:0},firesG));
  DATA.fwi_red.forEach(i=>{const [la,lo]=DATA.cells[i];$('rect',{x:MX(lo-.25)+1,y:MY(la+.25)+1,width:cw-2,height:ch-2,fill:'none',stroke:PINK,'stroke-width':3,opacity:0},fwiG);});
  const k2=900/(42*Math.cos(48*Math.PI/180));
  s2outline.setAttribute('d',OUTLINE.map(([lo,la],i)=>(i?'L':'M')+(820+(lo-46)*k2*Math.cos(48*Math.PI/180)).toFixed(1)+','+(300+(55.6-la)*k2).toFixed(1)).join('')+'Z');
  for(let i=0;i<14;i++){const lo=50+rnd()*34,la=43+rnd()*10;const p=$('g',{},s2pins);p.dataset.x=820+(lo-46)*k2*Math.cos(48*Math.PI/180);p.dataset.y=300+(55.6-la)*k2;

function scene3(t,D){

/* ---------- timeline ---------- */
const SCENES=[[s1,scene1],[s2,scene2],[s3,scene3],[s4,scene4],[s5,scene5]];
const PAD=0.5;
const starts=[];let acc=0.4;TIMING.forEach(s=>{starts.push(acc);acc+=s.dur+PAD;});
const TOTAL=acc+1.2;
window.TOTAL=TOTAL;
const capT=document.getElementById('capT'),capBg=document.getElementById('capBg');
function caption(t){
  let line='';
  TIMING.forEach((s,i)=>{const lt=t-starts[i];if(lt<0||lt>s.dur+.2)return;
    const W=s.words;let cur=-1;W.forEach((w,j)=>{if(w.t<=lt)cur=j;});if(cur<0)return;
    let chunks=[],c=[];W.forEach((w,j)=>{c.push(j);if((w.b&&(w.p!==','||c.length>=4))||c.length>=8){chunks.push(c);c=[];}});if(c.length)chunks.push(c);
    const ch=chunks.find(c=>c.includes(cur));line=ch.map(j=>W[j].w+(W[j].p||'')).join(' ');});
  capT.textContent=line;
  if(line){const bb=capT.getBBox();set(capBg,{x:bb.x-30,y:bb.y-14,width:bb.width+60,height:bb.height+28,opacity:1});}else set(capBg,{opacity:0});
}
function render(t){
  let cur=0;
  SCENES.forEach(([g,f],i)=>{
    const st=starts[i], en=(i<SCENES.length-1?starts[i+1]:TOTAL+1);
    const vis=t>=st-0.35&&t<en;
    g.style.display=vis?'':'none';
    if(vis){const lt=t-starts[i];const D=TIMING[i].dur+PAD;f(Math.max(lt,0),D);
      const fin=i?prog(t,st-0.35,st+0.1):1;g.setAttribute('opacity',fin);}
    if(t>=st-0.35)cur=i;
  });
  // glitch bars around each cut
  const near=starts.slice(1).some(s=>Math.abs(t-(s-0.15))<0.22);
  seed=1+Math.floor(t*30);
  gl.forEach(r=>{if(near){set(r,{x:rnd()*1400,y:rnd()*1080,width:200+rnd()*600,height:4+rnd()*26,opacity:.55+rnd()*.4});}else set(r,{opacity:0});});
  root.setAttribute('transform',near?`translate(${(rnd()-.5)*30},0)`:'');
  set(recDot,{opacity:(t*1.2|0)%2?0.25:1});
  recT.textContent='REC '+NAMES[cur];
  const fr=Math.floor(t*30)%30,s=Math.floor(t);tc.textContent='00:'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+':'+String(fr).padStart(2,'0');
  caption(t);
}
